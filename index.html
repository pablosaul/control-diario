<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#1c1c20;--mut:#6d6b72;--line:#e5e1da;--soft:#efebe4;--acc:#c8102e;--ok:#1e9a57;--warn:#d68a00;--bad:#d64040;--today:#2f6fdb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d21;--ink:#f1efeb;--mut:#9a98a0;--line:#2e2d33;--soft:#26252b;--acc:#ff4d5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Arial,sans-serif}
h1,h2,h3,.num{font-family:Antonio,Arial Narrow,sans-serif;font-weight:700;letter-spacing:.01em}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand h1{margin:0;font-size:22px}.brand small{color:var(--mut);display:block;font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.meta-h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
#sync.err{color:var(--bad);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:16px}
.demo{background:#fff4d6;color:#6b4e00;border:1px solid #f0d58a;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .num{font-size:32px;line-height:1}.kpi span{color:var(--mut);font-size:12px}
.kpi.bad .num{color:var(--bad)}.kpi.warn .num{color:var(--warn)}.kpi.today .num{color:var(--today)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
.focus-list .fl{display:grid;grid-template-columns:150px 1fr 110px 130px 90px;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.focus-list .fl:last-child{border-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.bad{background:#fde3e3;color:#a12020}.tag.warn{background:#fff0cc;color:#7a5200}.tag.ok{background:#dcf3e5;color:#156b3d}.tag.today{background:#dfe9fb;color:#1f4fa3}
@media (prefers-color-scheme:dark){.tag.bad{background:#4a1f22;color:#ffb3b3}.tag.warn{background:#4a3a12;color:#ffd77a}.tag.ok{background:#173a28;color:#8fe0b2}.tag.today{background:#1c2c4a;color:#9bbcff}.demo{background:#3a3016;color:#ffe08a;border-color:#5c4b1d}}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acct-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 14px;cursor:pointer}
.acct-h h3{margin:0;font-size:18px;flex:1;min-width:160px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--mut)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.acct-b{border-top:1px solid var(--line);padding:10px 14px}
.item{display:grid;grid-template-columns:minmax(130px,1.1fr) 115px minmax(170px,2fr) 135px 128px 128px 140px minmax(90px,1fr) 104px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.item.ihead{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:0 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--card)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:Antonio,Arial Narrow,sans-serif;font-weight:700;font-size:16px}
.acct-h h3 small{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:12px;color:var(--mut);margin-left:6px}
.newf .n-t{flex:2;min-width:200px}
.newf select{min-width:130px}
.item:last-of-type{border-bottom:0}
.item.late{background:linear-gradient(90deg,rgba(214,64,64,.10),transparent 40%)}
.item.today{background:linear-gradient(90deg,rgba(47,111,219,.10),transparent 40%)}
.item.blk select[data-f=bloqueo]{border-color:var(--warn);color:var(--warn);font-weight:600}
.tipo{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--acc)}
.tipo.p{background:#5b5bd6}
.done{border:1px solid var(--ok);background:var(--card);border-radius:7px;height:32px;cursor:pointer;color:var(--ok);font:inherit;font-size:12px;font-weight:600;padding:0 8px;white-space:nowrap}
.fin{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.fin .fr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0}
.fin .fr b{color:var(--ink);font-weight:600}
.lbl{display:flex;flex-direction:column;font-size:10px;color:var(--mut);gap:2px}
input.bad-d{border-color:var(--bad);color:var(--bad)}
.done:hover{background:var(--ok);color:#fff}
.newf{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.newf input{flex:1;min-width:200px}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.bar{height:8px;background:var(--soft);border-radius:99px;position:relative;overflow:hidden;min-width:90px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:99px}
.bar i.p{background:#8fd3ad}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--ink)}
.card h3{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.card .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--mut)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.mini div{background:var(--soft);border-radius:8px;padding:6px 2px}.mini .num{font-size:20px;display:block}.mini span{font-size:11px;color:var(--mut)}
.mini .r .num{color:var(--bad)}.mini .w .num{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.load-row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--soft)}
.stack i{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;padding:20px;overflow:auto}
#modal.on{display:block}
.mbox{background:var(--card);max-width:900px;margin:20px auto;border-radius:14px;padding:18px}
.mbox h2{margin:0 0 4px;font-size:26px}
.gate{position:fixed;inset:0;background:var(--bg);z-index:60;display:grid;place-items:center;padding:20px}
.gate .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:360px;width:100%;text-align:center}
.gate h2{margin:0 0 6px;font-size:26px}
.gate .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hint{color:var(--mut);margin:0 0 12px}.hint a{color:var(--acc)}
.list{padding:0;overflow:hidden}
.lrow{display:grid;grid-template-columns:120px 80px minmax(110px,1fr) 90px minmax(160px,2fr) 70px minmax(150px,1.3fr) 250px;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.lrow.lhead{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:var(--soft)}
.lrow.late{background:linear-gradient(90deg,rgba(214,64,64,.10),transparent 45%)}
.lrow.today{background:linear-gradient(90deg,rgba(47,111,219,.10),transparent 45%)}
.lrow.closed{color:var(--mut)}
.lrow .c-tit small{display:block;color:var(--mut);font-size:11px}
.lrow .c-act{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.btn.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.btn.del{color:var(--bad)}
.btn.del-conf{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.lfoot{padding:8px 14px;font-size:12px;color:var(--mut)}
.eform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.eform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.eform label.w{grid-column:1 / -1}
.eform input,.eform select{font-size:14px;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){
 .lrow.lhead{display:none}
 .lrow{grid-template-columns:1fr 1fr;gap:4px 10px;padding:12px 14px}
 .lrow>span[data-l]::before{content:attr(data-l);display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
 .lrow .c-tit,.lrow .c-eta,.lrow .c-act{grid-column:1 / -1}
 .lrow .c-act{justify-content:flex-start;margin-top:4px}
 .eform{grid-template-columns:1fr}
}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media(max-width:1000px){
 .item{grid-template-columns:1fr 1fr;padding:10px 0}
 .item.ihead{display:none}
 .item .f-tit,.item .f-not{grid-column:1 / -1}
 .focus-list .fl{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><h1>Control diario</h1><small id="hdate"></small></div>
  <div class="meta-h"><span id="who"></span><span>·</span><span id="sync">—</span><button class="btn sm" data-act="refresh">Actualizar</button></div>
  <nav class="tabs"><button data-act="tab" data-v="registrar" class="on">Registrar</button><button data-act="tab" data-v="listado">Listado</button><button data-act="tab" data-v="dash">Dashboard</button></nav>
</div></header>
<main id="app"></main>
<div id="modal"></div>
<div id="gate"></div>

<script>
/* ==================== CONFIGURACIÓN ==================== */
const CONFIG = {
  // Pega aquí la URL de la App web de Apps Script (termina en /exec).
  // Si está vacía, el cuadro funciona en MODO PRUEBA guardando solo en este navegador.
  API_URL: 'https://script.google.com/macros/s/AKfycbxicgkk7ZnMWzpgA7zvlKsVGSpCOpfEv2HvK7hLzADLoLKVUe2CV8upoHVv0NDlLBQlMg/exec'
};
/* Equipo de producción: la reunión se recorre persona por persona */
const PRODUCCION = [
  {n:'Diego',   rol:'Editor'},
  {n:'Jairo',   rol:'Editor'},
  {n:'Richard', rol:'Diseñador'},
  {n:'Adriana', rol:'Diseñadora'}
];
const EQUIPO   = PRODUCCION.map(p=>p.n);
const REGISTRAN= ['Ashly','Yadhira','Pablo'];
const ETAPAS_C = ['Por hacer','En proceso','Revisión interna','Corrección','Terminado','Publicado'];
const ETAPAS_P = ['Abierto','En curso','Esperando cliente','Hecho'];
const EN_MANOS = ['Por hacer','En proceso','Corrección'];   // etapas en que la tarea está en manos del editor/diseñador
const CERRADAS = ['Terminado','Publicado','Hecho'];
const FORMATOS = ['Reel','Video','Carrusel','Post','Historia','Portada','Pieza gráfica','Artículo LinkedIn','Otro'];
const REDES    = ['Instagram','TikTok','Facebook','LinkedIn','YouTube','Varias'];
const BLOQUEOS = ['Esperando material del cliente','Esperando aprobación del cliente','Falta grabación','Carga de editor / diseño','Falta información interna','Otro'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* Cuentas de ejemplo para el modo prueba (en producción vienen del Sheet) */
const SEED_CUENTAS = [
 ['Gran Tauro','Mensual',12,'mes','','','','','SI',''],
 ['Escuelas del Mundo','','','','','','2026-11-15','','SI','Sin cantidad definida'],
 ['Anilu','Trimestral','','','','','2026-11-11','','SI','Renovación 11 nov'],
 ['Modeco','Trimestral',8,'contrato','','2026-09-07','2026-12-07','','SI','8 videos por trimestre'],
 ['Nua Baby','Trimestral','','','','','2026-11-18','','SI','Sin cantidad definida'],
 ['Propósito','Trimestral',12,'mes','','2026-08-08','2026-11-08','','SI','12 videos al mes'],
 ['Dolce Nonno','',6,'mes','','','2026-12-28','','SI','6 videos mensuales'],
 ['HVH Inmuebles','Trimestral',12,'mes','','2026-07-15','2026-10-15','','SI',''],
 ['Marina Rossel','Trimestral',12,'mes','','2026-07-15','2026-10-15','','SI','Culminó 15 oct'],
 ['ONG ADI','Trimestral','','','','2026-07-03','2026-10-03','','SI','Sin cantidad definida'],
 ['La Casa del Chicharrón','',12,'mes','','','2026-10-30','','SI',''],
 ['Francisco Calizaya','Trimestral',12,'mes','','2026-06-13','2026-09-13','','SI',''],
 ['3F Equipos','Trimestral',12,'mes','','2026-07-11','2026-10-11','','SI',''],
 ['Fabiola Arteaga','','','','','','2026-12-31','','SI','Termina diciembre'],
 ['La Espátula Verde (Karen Lema)','',12,'mes','','2026-10-13','','','SI','Confirmar si 13 oct es inicio o cierre'],
 ['Anka','Mensual',9,'mes','','','','','SI',''],
 ['Kapek Internacional','Mensual',12,'mes',28,'','','','SI','Corte el 28 de cada mes']
];
const CUENTA_KEYS=['cuenta','modalidad','meta','periodo_meta','dia_corte','inicio','fin','monto','activa','notas'];

/* ==================== ESTADO ==================== */
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const S={cuentas:[],items:[],reuniones:[],historial:[],user:ls('cd_user')||'',pin:ls('cd_pin')||'',view:ls('cd_view')||'registrar',lf:{estado:'abiertas',persona:'',cuenta:''},confirmDel:null,
  open:new Set(JSON.parse(ls('cd_open')||'[]')),modo:ls('cd_modo')||'persona',focusK:null,q:'',solo:false,pending:{}};

/* ==================== UTILIDADES ==================== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Lima'});
const D=s=>new Date(s+'T12:00:00');
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fmt=s=>{if(!s)return'—';const d=D(s);return `${d.getDate()} ${MESES[d.getMonth()]}`};
const stamp=()=>{const n=new Date();return today()+' '+n.toLocaleTimeString('es-PE',{timeZone:'America/Lima',hour:'2-digit',minute:'2-digit',hour12:false})};
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isOpen=i=>!CERRADAS.includes(i.etapa);
const activas=()=>S.cuentas.filter(c=>String(c.activa||'SI').toUpperCase()!=='NO');

function normCuenta(c){return {...c,meta:+c.meta||0,dia_corte:+c.dia_corte||0,periodo_meta:String(c.periodo_meta||'').toLowerCase().trim()}}

function periodo(c){
  const t=today();
  if(c.periodo_meta==='contrato'&&c.inicio&&c.fin) return {ini:c.inicio,fin:c.fin,label:'del contrato'};
  if(c.periodo_meta==='mes'){
    const d=D(t);
    if(c.dia_corte){
      let s=new Date(d.getFullYear(),d.getMonth(),c.dia_corte,12);
      if(d.getDate()<c.dia_corte) s=new Date(d.getFullYear(),d.getMonth()-1,c.dia_corte,12);
      const e=new Date(s.getFullYear(),s.getMonth()+1,c.dia_corte-1,12);
      return {ini:iso(s),fin:iso(e),label:`ciclo ${fmt(iso(s))} – ${fmt(iso(e))}`};
    }
    return {ini:iso(new Date(d.getFullYear(),d.getMonth(),1,12)),fin:iso(new Date(d.getFullYear(),d.getMonth()+1,0,12)),label:'del mes'};
  }
  return null;
}
function contrato(c){
  if(!c.fin) return {k:'',txt:'Sin fecha de cierre'};
  const d=days(today(),c.fin);
  if(d<0) return {k:'bad',txt:`Vencido hace ${-d} d · confirmar renovación`};
  if(d<=15) return {k:'warn',txt:`Vence en ${d} d (${fmt(c.fin)})`};
  return {k:'ok',txt:`Vigente hasta ${fmt(c.fin)}`};
}
function stats(c){
  const t=today();
  const its=S.items.filter(i=>i.cuenta===c.cuenta);
  const open=its.filter(isOpen);
  const late=open.filter(i=>i.fecha_objetivo&&i.fecha_objetivo<t);
  const lateHard=late.filter(i=>days(i.fecha_objetivo,t)>2);
  const hoy=open.filter(i=>i.fecha_objetivo===t);
  const bloq=open.filter(i=>i.bloqueo);
  const prod=open.filter(i=>i.tipo==='Contenido');
  const per=periodo(c);
  let pub=0,prog=0,esperado=null,avance=null;
  if(c.meta&&per){
    pub=its.filter(i=>i.tipo!=='Pendiente'&&!isOpen(i)&&i.cerrado>=per.ini&&i.cerrado<=per.fin).length;
    prog=prod.filter(i=>i.etapa==='Programado').length;
    const tot=days(per.ini,per.fin)+1, el=Math.max(0,Math.min(tot,days(per.ini,t)+1));
    esperado=c.meta*el/tot; avance=esperado>0?(pub+prog)/esperado:1;
  }
  // el ritmo de la meta solo se evalúa cuando la cuenta ya tiene registros (evita rojo falso el primer día)
  const pace=its.length?avance:null;
  let sem='ok';
  if(lateHard.length||(pace!==null&&pace<.7)) sem='bad';
  else if(late.length||bloq.length||(pace!==null&&pace<1)) sem='warn';
  if(!its.length) sem='';
  const prox=prod.filter(i=>i.fecha_objetivo&&i.fecha_objetivo>=t).sort((a,b)=>a.fecha_objetivo.localeCompare(b.fecha_objetivo))[0];
  return {its,open,late,hoy,bloq,prod,per,pub,prog,esperado,avance,sem,prox,ct:contrato(c)};
}

/* ==================== API ==================== */
async function apiGet(){
  if(!CONFIG.API_URL) return demoDB();
  const r=await fetch(CONFIG.API_URL+'?pin='+encodeURIComponent(S.pin));
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function apiPost(action,data){
  if(!CONFIG.API_URL) return demoPost(action,data);
  const r=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify({action,data,pin:S.pin,user:S.user})});
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}
/* --- modo prueba (localStorage) --- */
function demoDB(){
  let db=null; try{db=JSON.parse(ls('cd_demo'))}catch(e){}
  if(!db){db={cuentas:SEED_CUENTAS.map(r=>Object.fromEntries(CUENTA_KEYS.map((k,i)=>[k,r[i]]))),items:[],reuniones:[],historial:[]};ls('cd_demo',JSON.stringify(db))}
  return db;
}
function demoPost(action,data){
  const db=demoDB(), now=stamp();
  if(action==='upsertItem'){
    const ix=db.items.findIndex(i=>i.id===data.id);
    if(ix<0){db.items.push(data);db.historial.push({fecha:now,id:data.id,cuenta:data.cuenta,campo:'creado',antes:'',despues:data.titulo,por:S.user})}
    else{['cuenta','etapa','responsable','fecha_inicio','fecha_objetivo','bloqueo','titulo'].forEach(k=>{const a=String(db.items[ix][k]??''),b=String(data[k]??'');if(a!==b)db.historial.push({fecha:now,id:data.id,cuenta:data.cuenta,campo:k,antes:a,despues:b,por:S.user})});db.items[ix]=data}
  }
  if(action==='saveReunion'){const ix=db.reuniones.findIndex(r=>r.fecha===data.fecha);ix<0?db.reuniones.push(data):db.reuniones[ix]=data}
  ls('cd_demo',JSON.stringify(db)); return {ok:true};
}

/* ==================== CARGA Y GUARDADO ==================== */
function setSync(t,err){const el=document.getElementById('sync');el.textContent=t;el.classList.toggle('err',!!err)}
async function load(silent){
  if(!silent) setSync('Cargando…');
  try{
    const d=await apiGet();
    S.cuentas=(d.cuentas||[]).filter(c=>c.cuenta).map(normCuenta);
    S.items=(d.items||[]).map(i=>({...i,id:String(i.id)})).map(i=>S.pending[i.id]||i).concat(Object.values(S.pending).filter(p=>!(d.items||[]).some(i=>String(i.id)===p.id))).filter(i=>i.etapa!=='Eliminado');
    S.reuniones=d.reuniones||[]; S.historial=d.historial||[];
    setSync(Object.keys(S.pending).length?'Cambios sin guardar':'Al día '+stamp().slice(11));
    render();
  }catch(e){
    if(/pin/i.test(e.message)){ls('cd_pin',null);S.pin='';gatePin('PIN incorrecto');return}
    setSync('Sin conexión: '+e.message,true);
  }
}
async function save(it){
  it.actualizado=stamp(); it.actualizado_por=S.user;
  S.pending[it.id]={...it}; setSync('Guardando…');
  try{await apiPost('upsertItem',it);delete S.pending[it.id];setSync(Object.keys(S.pending).length?'Guardando…':'Guardado '+stamp().slice(11))}
  catch(e){setSync('No se guardó — toca Actualizar para reintentar',true)}
}
async function retryPending(){for(const it of Object.values(S.pending)) await save(it)}

function render(){

  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));

  document.getElementById('app').innerHTML=(CONFIG.API_URL?'':'<div class="demo"><b>Modo prueba:</b> los datos se guardan solo en este navegador. Conecta el Sheet pegando la URL del Apps Script en <code>CONFIG.API_URL</code>.</div>')+(S.view==='listado'?viewListado():S.view==='dash'?viewDash():viewRegistrar());
  window.scrollTo(0,y);
}
function sel(f,opts,v,ph,cls,id){
  const o=(v&&!opts.includes(v))?[...opts,v]:opts;   // conserva valores antiguos que ya no están en la lista
  return `<select ${f?`data-f="${f}"`:''} ${cls?`class="${cls}"`:''} ${id?`id="${id}"`:''}>${ph!=null?`<option value="">${esc(ph)}</option>`:''}${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}

/* fila de alta rápida: cliente + formato + nombre del video + inicio + entrega */
function addRow(key){

function metaBar(s,c){
  if(!c.meta||!s.per) return '';

  return `<div style="display:flex;align-items:center;gap:8px;min-width:160px"><div class="bar" style="flex:1"><i class="p" style="width:${w(s.pub+s.prog)}%"></i><i style="width:${w(s.pub)}%"></i><b style="left:${w(s.esperado)}%"></b></div><span class="tag">${s.pub}/${c.meta}</span></div>`;
}

    ${c.meta&&s.per?`<p>${s.pub} terminados de ${c.meta}. A la fecha se esperaban ~${Math.round(s.esperado)}.</p>${metaBar(s,c)}`:''}
    <h3 style="margin-top:16px">Abiertos (${s.open.length})</h3>
    ${s.open.length?`<table><tr><th></th><th>Descripción</th><th>Formato</th><th>Responsable</th><th>Etapa</th><th>Fecha</th><th>Bloqueo</th></tr>${s.open.map(li).join('')}</table>`:'<div class="empty">Nada abierto.</div>'}
    <h3 style="margin-top:16px">Cerrados recientes</h3>
    ${cerr.length?`<table><tr><th></th><th>Descripción</th><th>Formato</th><th>Responsable</th><th>Etapa</th><th>Fecha</th><th></th></tr>${cerr.map(li).join('')}</table>`:'<div class="empty">Aún no hay cerrados.</div>'}
    <h3 style="margin-top:16px">Últimos movimientos</h3>
    ${hist.length?`<table><tr><th>Cuándo</th><th>Quién</th><th>Cambio</th></tr>${hist.map(h=>`<tr><td>${esc(h.fecha)}</td><td>${esc(h.por)}</td><td>${h.campo==='creado'?'Creó: '+esc(h.despues):`${esc(h.campo.replace('_',' '))}: ${esc(h.antes||'—')} → <b>${esc(h.despues||'—')}</b>`}</td></tr>`).join('')}</table>`:'<div class="empty">Sin movimientos.</div>'}
  </div>`;
  m.classList.add('on');
}

/* ==================== EVENTOS ==================== */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='lf-persona'){S.lf.persona=el.value;render()}
  if(el.id==='lf-cuenta'){S.lf.cuenta=el.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},300)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.newf')){e.preventDefault();addFrom(e.target.closest('.newf'))} if(e.key==='Escape')closeModal()});
function addFrom(f){
  const k=f.dataset.k, g=s=>f.querySelector(s);
  const cuenta=g('.n-c').value, resp=k;
  const tit=g('.n-t').value.trim(), formato=g('.n-f').value, fecha=g('.n-d').value, ini=g('.n-i').value;
  if(!cuenta){g('.n-c').focus();g('.n-c').style.borderColor='var(--bad)';return}
  if(!tit){g('.n-t').focus();g('.n-t').style.borderColor='var(--bad)';return}
  if(ini&&fecha&&fecha<ini){g('.n-d').classList.add('bad-d');g('.n-d').focus();toast('La entrega no puede ser antes del inicio');return}
  const it={id:uid(),creado:stamp(),creado_por:S.user,cuenta,tipo:'Contenido',titulo:tit,formato,red:'',responsable:resp,
    etapa:'Por hacer',fecha_inicio:ini,fecha_objetivo:fecha,bloqueo:'',notas:'',cerrado:''};
  S.items.push(it); render(); save(it); toast(`Agregada a ${resp}: ${cuenta} · ${tit}`);
  // deja listo el mismo renglón para la siguiente tarea (conserva cliente, formato y fechas)
  const nf=document.querySelector(`.newf[data-k="${CSS.escape(k)}"]`);
  if(nf){ nf.querySelector('.n-c').value=cuenta; nf.querySelector('.n-f').value=formato;
    nf.querySelector('.n-d').value=fecha; nf.querySelector('.n-i').value=ini; nf.querySelector('.n-t').focus(); }
}
function persistOpen(){ls('cd_open',JSON.stringify([...S.open]))}
function closeModal(){const m=document.getElementById('modal');m.classList.remove('on');m.innerHTML=''}
document.addEventListener('click',async e=>{
  if(e.target.id==='modal'){closeModal();return}
  const a=e.target.closest('[data-act]');
  if(S.confirmDel&&(!a||a.dataset.act!=='del')){S.confirmDel=null;if(!a){render();return}}
  if(!a) return;
  if(a.tagName==='A') e.preventDefault();
  const act=a.dataset.act, c=a.dataset.c;
  const rowIt=()=>S.items.find(x=>x.id===(a.closest('[data-id]')||{}).dataset?.id);
  switch(act){
    case 'tab': S.view=a.dataset.v; ls('cd_view',S.view); render(); window.scrollTo(0,0); break;
    case 'refresh': await retryPending(); load(); break;
    case 'verpersona': S.view='listado'; S.lf={estado:'abiertas',persona:a.dataset.p,cuenta:''}; S.q=''; render(); window.scrollTo(0,0); break;
    case 'estado': S.lf.estado=a.dataset.v; render(); break;
    case 'clearf': S.lf.persona=''; S.lf.cuenta=''; S.q=''; render(); break;
    case 'jump': S.view='listado'; S.lf={estado:'abiertas',persona:'',cuenta:c}; S.q=''; render(); window.scrollTo(0,0); break;
    case 'add': addFrom(a.closest('.newf')); break;
    case 'close': { const it=rowIt(); if(!it) break;
      it.etapa=it.tipo==='Pendiente'?'Hecho':'Terminado'; it.cerrado=today(); it.bloqueo='';
      render(); save(it); toast('Tarea terminada ✓'); break; }
    case 'reopen': { const it=rowIt(); if(!it) break;
      it.etapa='En proceso'; it.cerrado=''; render(); save(it); toast('Tarea reabierta'); break; }
    case 'del': { const it=rowIt(); if(!it) break;
      if(S.confirmDel===it.id) borrar(it); else { S.confirmDel=it.id; render(); } break; }
    case 'edit': { const it=rowIt(); if(it) modalEditar(it.id); break; }
    case 'msave': {
      const box=a.closest('.mbox'), it=S.items.find(x=>x.id===box.dataset.id); if(!it) break;
      const v=k=>box.querySelector('.e-'+k).value;
      const ini=v('fecha_inicio'), ent=v('fecha_objetivo'), tit=v('titulo').trim();
      if(!tit){box.querySelector('.e-err').textContent='Falta el nombre del video o pieza.';break}
      if(ini&&ent&&ent<ini){box.querySelector('.e-err').textContent='La entrega no puede ser antes del inicio.';break}
      const antes=it.etapa;
      ['cuenta','responsable','formato','etapa','fecha_inicio','fecha_objetivo','bloqueo','notas'].forEach(k=>it[k]=v(k)); it.titulo=tit;
      if(it.etapa!==antes) it.cerrado=CERRADAS.includes(it.etapa)?(it.cerrado||today()):'';
      closeModal(); render(); save(it); toast('Cambios guardados'); break;
    }
    case 'mdel': {
      if(a.dataset.ok){ const it=S.items.find(x=>x.id===a.closest('.mbox').dataset.id); closeModal(); if(it) borrar(it); }
      else { a.dataset.ok='1'; a.textContent='¿Seguro? Toca otra vez para eliminar'; a.classList.add('del-conf'); }
      break;
    }
    case 'acct': modalCuenta(c); break;
    case 'mclose': closeModal(); break;
    case 'saveActa': {
      const data={fecha:today(),registrado_por:S.user,asistentes:[...document.querySelectorAll('.asis:checked')].map(x=>x.value).join(', '),notas:document.getElementById('acta').value,actualizado:stamp()};
      const ix=S.reuniones.findIndex(r=>r.fecha===data.fecha); ix<0?S.reuniones.push(data):S.reuniones[ix]=data;
      setSync('Guardando acta…');
      try{await apiPost('saveReunion',data);setSync('Acta guardada');render()}catch(err){setSync('No se guardó el acta',true)}
      break;
    }
    case 'setuser': S.user=a.dataset.u; ls('cd_user',S.user); document.getElementById('gate').innerHTML=''; start(); break;
  }
});
document.getElementById('who').addEventListener('click',()=>gateUser());
document.getElementById('who').style.cursor='pointer';

/* ==================== INICIO ==================== */
function gatePin(msg){
  document.getElementById('gate').innerHTML=`<div class="gate"><div class="box"><h2>Control diario</h2><p style="color:var(--mut)">${msg||'Ingresa el PIN del equipo'}</p>
  <input id="pin" type="password" inputmode="numeric" style="width:100%;text-align:center;font-size:18px"><div class="opts"><button class="btn pri" id="pinok">Entrar</button></div></div></div>`;
  const go=()=>{S.pin=document.getElementById('pin').value.trim();if(!S.pin)return;ls('cd_pin',S.pin);document.getElementById('gate').innerHTML='';start()};
  document.getElementById('pinok').onclick=go; document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')go()}; document.getElementById('pin').focus();
}
function gateUser(){
  document.getElementById('gate').innerHTML=`<div class="gate"><div class="box"><h2>¿Quién registra?</h2><p style="color:var(--mut)">Cada cambio queda firmado con este nombre.</p>
  <div class="opts">${REGISTRAN.map(u=>`<button class="btn ${u===S.user?'pri':''}" data-act="setuser" data-u="${u}">${u}</button>`).join('')}</div></div></div>`;
}
function start(){
  if(CONFIG.API_URL&&!S.pin) return gatePin();
  if(!S.user) return gateUser();
  render(); load();
}
// refresco automático cada 90 s si nadie está escribiendo (para trabajar juntas)
setInterval(()=>{const a=document.activeElement;if(document.hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||document.getElementById('modal').classList.contains('on'))return;load(true)},90000);
start();
</script>
